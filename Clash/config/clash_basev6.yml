# clash_basev6.yaml (核心全局配置)
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true
prefer-ipv4: true
log-level: info
unified-delay: true
tcp-concurrent: true

# 1. TUN 配置
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
    - "[::]:53"
    - "tcp://[::]:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# 2. DNS 配置
dns:
  enable: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  # 1. 基础解析 DNS（纯 IP，负责解析 proxy-server 等的 DoH 域名）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 2400:3200::1

  # 2. 代理节点域名解析 DNS（国内加密 DoH，防止节点连接被劫持）
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://[2400:3200::1]/dns-query

  # 3. 直连域名解析 DNS（命中 DIRECT 规则时由它负责解析国内真实 CDN IP）
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://[2400:3200::1]/dns-query

  
  # 4. 代理与默认回退 DNS（强制走加密代理隧道，彻底杜绝境外解析泄露）
  nameserver:
    - https://8.8.8.8/dns-query#节点选择
    - https://1.1.1.1/dns-query#节点选择
    - https://[2001:4860:4860::8888]/dns-query

  # 5. 真实 IP 过滤白名单（精简高效，仅放行底层系统服务）
  fake-ip-filter:
    - "geosite:private"             # 局域网与本地设备
    - "geosite:category-ntp"        # 网络对时服务
    - "geosite:connectivity-check"  # 联网连通性检测
    - "+.push.apple.com"            # 苹果推送长连接

  # # 6. 域名特定分流策略（精准匹配，彻底防止 IPv4/IPv6 泄漏）
  # nameserver-policy:
    # # 1. 优先解决 Google Play 商店下载问题（强制走代理 DNS 解析）
    # "+.googleapis.cn,+.xn--ngstr-lra8j.com":
      # - https://8.8.8.8/dns-query#节点选择&disable-qtype-65=true
      # - https://1.1.1.1/dns-query#节点选择&disable-qtype-65=true

    # # 3. deepseek
    # "+.deepseek.com,+.deepseeksvc.com":
      # - https://8.8.8.8/dns-query#userproxy&disable-qtype-65=true
      # - https://1.1.1.1/dns-query#userproxy&disable-qtype-65=true

    # # 2. 其他国内域名正常走国内 DNS
    # "geosite:cn,private":
      # - https://dns.alidns.com/dns-query#disable-qtype-65=true
      # - https://doh.pub/dns-query#disable-qtype-65=true
      # - https://[2400:3200::1]/dns-query#disable-qtype-65=true


# 必须保留 proxies, proxy-groups, rules 占位符，Subconverter 会自动填充它们
proxies: []
proxy-groups: []
rules: []
