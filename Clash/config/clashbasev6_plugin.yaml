name: DNS覆写

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true
prefer-ipv4: true
log-level: info
unified-delay: true
tcp-concurrent: true

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
    - "[::]:53"
    - "tcp://[::]:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  use-hosts: true

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 2400:3200::1

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://[2400:3200::1]/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://[2400:3200::1]/dns-query

  
  nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
    - https://[2001:4860:4860::8888]/dns-query

  fake-ip-filter:
    - "geosite:private"
    - "geosite:category-ntp"
    - "geosite:connectivity-check"
    - "+.push.apple.com"

  nameserver-policy:
    "+.googleapis.cn,+.xn--ngstr-lra8j.com":
      - https://8.8.8.8/dns-query
      - https://1.1.1.1/dns-query

    "+.deepseek.com,+.deepseeksvc.com":
      - https://8.8.8.8/dns-query#userproxy
      - https://1.1.1.1/dns-query#userproxy

    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
      - https://[2400:3200::1]/dns-query


proxies: []
proxy-groups: []
rules: []
